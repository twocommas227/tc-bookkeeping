# Two Commas LLC bookkeeping tool - rule file (v1)
# Source: docs/RULES.md section 1.5. Ordering and values as written there.
# Vendor Rules rows refer to the 1-based data rows of tests/fixtures/vendor_rules.csv.
version: 1
rules:
  # Vendor Rules rows: 23, 30
  - id: wise-fee-line
    priority: 10
    match:
      account: "USD account 1430"
      description: '^Wise Charges for:'
    action: follow_parent

  # Vendor Rules rows: 22
  - id: wise-interest
    priority: 11
    match:
      account: "USD account 1430"
      raw_type: BALANCE_INTEREST
      sign: credit
    action: categorize
    category: "Interest Income"
    type: Income

  # Vendor Rules rows: 21, 32
  - id: wise-jar-move
    priority: 12
    match:
      account: "USD account 1430"
      raw_type: CONVERSION
      description: '^Moved [\d,.]+ USD (to|from) (Rent & Utilities|Taxes)$'
    action: categorize
    category: "Bank Transfer"
    type: Transfer
    transfer_role: jar_move

  # Vendor Rules rows: 9, 31
  - id: firstbase-35
    priority: 20
    match:
      account: "J. DECKER 2110"
      description: 'FIRSTBASE\.IO'
      amount_cents: -3500
    action: categorize
    category: "Postage & Delivery"
    type: Expense

  # Vendor Rules rows: 7
